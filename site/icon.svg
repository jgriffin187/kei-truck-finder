<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd43b"/><stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="404" rx="214" ry="13" fill="#000" opacity=".15"/>
  <g stroke="#16181c" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <!-- cab guard (ladder rack) -->
    <path d="M214 270 V146 H250 V270 M214 190 H250" fill="none" stroke-width="10"/>
    <!-- bed with rear wheel arch -->
    <path d="M206 258 H464 V344 H442 A58 58 0 0 0 326 344 H206 Z" fill="#fff"/>
    <path d="M292 258 V344 M378 258 V310" fill="none" stroke-width="7"/>
    <!-- cab with front wheel arch -->
    <path d="M48 344 V250 Q48 236 55 224 L104 146 Q110 136 122 136 H198 Q208 136 208 146 V344 H182 A58 58 0 0 0 66 344 Z" fill="#fff"/>
    <!-- windows -->
    <path d="M74 232 L116 160 Q120 154 127 154 H188 V232 Z" fill="#2c3a4a" stroke-width="8"/>
    <path d="M144 154 L140 232" fill="none" stroke-width="7"/>
    <!-- door seam + handle -->
    <path d="M140 246 V300 M184 258 H170" fill="none" stroke-width="6"/>
    <!-- headlight + bumper -->
    <rect x="44" y="256" width="24" height="30" rx="5" fill="#fff4cc" stroke-width="7"/>
    <rect x="34" y="312" width="34" height="32" rx="7" fill="#16181c"/>
    <!-- wheels -->
    <circle cx="124" cy="356" r="44" fill="#16181c"/>
    <circle cx="384" cy="356" r="44" fill="#16181c"/>
  </g>
  <path d="M58 274 H200 M212 274 H458" stroke="#c8102e" stroke-width="9" stroke-linecap="round"/>
  <circle cx="124" cy="356" r="18" fill="#c9ced6"/>
  <circle cx="384" cy="356" r="18" fill="#c9ced6"/>
</svg>
