name: Truck refresh and watcher

on:
  schedule:
    # 09:17 UTC = 2:17 AM MST / 3:17 AM MDT, well before the 5 AM check. This
    # is the daily run that always emails a summary.
    - cron: "17 9 * * *"
    # The watcher: every 2 hours, all day, so a new truck is alerted soon
    # after it's listed. GitHub often starts scheduled runs late or skips one.
    - cron: "47 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/index.html", "site/*.png", "site/icon.svg", "site/favicon.ico", "site/manifest.webmanifest", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Always start from the newest main, not the commit that triggered the
      # run. A queued push run or a "Re-run" of an older run would otherwise
      # collect with old code and old state.json, and its push would be
      # rejected because main has moved on (2026-11-25 and 11-26 failures).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pillow
      - name: Collect listings
        run: python collector.py --dir .
      - name: Write new-truck alert
        # The daily 09:17 run and manual runs always write a summary, so Josh
        # hears from every daily run even when nothing is new. Watcher runs
        # (every 2 hours) and runs started by a merge only write one when they
        # find new trucks that are legal now or within 2 months.
        run: >-
          python alert.py --dir . --out "$RUNNER_TEMP/alert.md" --warn-out "$RUNNER_TEMP/warn.md"
          ${{ ((github.event_name == 'schedule' && github.event.schedule == '17 9 * * *') || github.event_name == 'workflow_dispatch') && '--summary' || '' }}
      - name: Email Josh about new trucks
        # An issue assigned to Josh makes GitHub email him, the same way its
        # run-failure emails reach him.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/alert.md" ]; then
            n=$(grep -c '^- ' "$RUNNER_TEMP/alert.md" || true)
            if [ "$n" = 0 ]; then
              title="No new kei trucks"
            else
              title="$n new kei truck$([ "$n" = 1 ] || echo s)"
            fi
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee jgriffin187 \
              --title "$title $(TZ=America/Denver date +'%a %b %-d, %-I:%M %p MT')" \
              --body-file "$RUNNER_TEMP/alert.md" || echo "Could not open the alert issue"
          fi
          if [ -s "$RUNNER_TEMP/warn.md" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee jgriffin187 \
              --title "$(cat "$RUNNER_TEMP/warn.md.title")" \
              --body-file "$RUNNER_TEMP/warn.md" || echo "Could not open the warning issue"
          fi
      - name: Check saved trucks
        # Reads Josh's saved trucks from his secret sync gist (secret
        # SAVED_GIST_ID) and notes any that were reserved, sold or relisted.
        env:
          SAVED_GIST_ID: ${{ secrets.SAVED_GIST_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python saved_alert.py --dir . --out "$RUNNER_TEMP/saved.md"
      - name: Email Josh about saved trucks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/saved.md" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee jgriffin187 \
              --title "$(cat "$RUNNER_TEMP/saved.md.title") $(TZ=America/Denver date +'%a %b %-d')" \
              --body-file "$RUNNER_TEMP/saved.md" || echo "Could not open the saved-truck issue"
          fi
      - name: Build site data
        run: python build.py --dir . --remote-images
      - name: Save history
        # This run just rebuilt these three files. If someone merged to main
        # while the run was collecting, lay this run's data on top of the
        # newest main and push again instead of failing and skipping the
        # deploy. This run's data wins for these three files.
        run: |
          git config user.name "kei-truck-bot"
          git config user.email "kei-truck-bot@users.noreply.github.com"
          data="$RUNNER_TEMP/data"
          mkdir -p "$data/site"
          cp state.json listings.json "$data/"
          cp site/data.json "$data/site/"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --depth=1 origin main
            git reset --quiet --hard origin/main
            cp "$data/state.json" "$data/listings.json" .
            cp "$data/site/data.json" site/
            git add state.json listings.json site/data.json
            if git diff --cached --quiet; then
              echo "No listing changes to save"
              exit 0
            fi
            git commit --quiet -m "Listings $(date -u +'%F %H:%M') UTC"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the push; trying again (attempt $attempt)"
            sleep $((attempt * 5))
          done
          echo "Could not save history after 5 tries"
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy runs as its own job, the layout GitHub documents for Pages: by the
  # time it starts, the uploaded site is registered with the run. Deploying in
  # the same step list as the upload sometimes fails with "No artifacts named
  # github-pages were found" (2026-11-23).
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
