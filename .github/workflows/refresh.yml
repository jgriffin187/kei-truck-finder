name: Daily truck refresh

on:
  schedule:
    # 09:17 UTC = 2:17 AM MST / 3:17 AM MDT, well before the 5 AM check.
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/index.html", "site/*.png", "site/icon.svg", "site/favicon.ico", "site/manifest.webmanifest", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pillow
      - name: Collect listings
        run: python collector.py --dir .
      - name: Write new-truck alert
        run: python alert.py --dir . --out "$RUNNER_TEMP/alert.md"
      - name: Email Josh about new trucks
        # An issue assigned to Josh makes GitHub email him, the same way its
        # run-failure emails reach him.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/alert.md" ]; then
            n=$(grep -c '^- ' "$RUNNER_TEMP/alert.md")
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee jgriffin187 \
              --title "$n new kei truck$([ "$n" = 1 ] || echo s) $(TZ=America/Denver date +'%a %b %-d')" \
              --body-file "$RUNNER_TEMP/alert.md" || echo "Could not open the alert issue"
          fi
      - name: Check saved trucks
        # Reads Josh's saved trucks from his secret sync gist (secret
        # SAVED_GIST_ID) and notes any that were reserved, sold or relisted.
        env:
          SAVED_GIST_ID: ${{ secrets.SAVED_GIST_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python saved_alert.py --dir . --out "$RUNNER_TEMP/saved.md"
      - name: Email Josh about saved trucks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/saved.md" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee jgriffin187 \
              --title "$(cat "$RUNNER_TEMP/saved.md.title") $(TZ=America/Denver date +'%a %b %-d')" \
              --body-file "$RUNNER_TEMP/saved.md" || echo "Could not open the saved-truck issue"
          fi
      - name: Build site data
        run: python build.py --dir . --remote-images
      - name: Save history
        run: |
          git config user.name "kei-truck-bot"
          git config user.email "kei-truck-bot@users.noreply.github.com"
          git add state.json listings.json site/data.json
          git diff --cached --quiet || git commit -m "Daily listings $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy runs as its own job, the layout GitHub documents for Pages: by the
  # time it starts, the uploaded site is registered with the run. Deploying in
  # the same step list as the upload sometimes fails with "No artifacts named
  # github-pages were found" (2026-11-23).
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
